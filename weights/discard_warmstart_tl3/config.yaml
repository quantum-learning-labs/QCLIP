model_type: vqc
mlflow_db: mlf_dbs/hp3_pool.db
batch_size: 256
qlr: 0.01
clr: 0.0001
patience: 12
min_delta: 0.001
epochs: 100
embedding_qubits: 3
out_dim: 512
emulate:
  set: swap_full
  noise: false
  optimization_level: 1
  resolution: 10000
  num_runs: 10
  backend: statevector
  measurement_method: destructive_swap
text:
  n: 1
  s: 1
  p: 1
  layers: 3
  curry: true
  spider: false
  discard: true
vision:
  layers: 2
  method: mlp
dataset:
  name: "svo-probes"
  class: "modules.data_pipeline.datasets.SVODataset"
  collate_fn: "modules.data_pipeline.datasets.svo_collate_fn"
  eval_mapper: "modules.data_pipeline.datasets.svo_mapper"

  # the split these weights were trained and tested on (row-level; see configs/data/svo-probes.yaml)
  split: legacy

  train:
    text_path: "data/svo-probes/processed/all.pkl"
    img_path: "data/svo-probes/processed/image_embeddings.pt"
  val:
    text_path: "data/svo-probes/processed/all.pkl"
    img_path: "data/svo-probes/processed/image_embeddings.pt"
    diagnostics:
      - "evaluate_image_choice"
      - "diagnostic_image_choice"

  test:
    std:   # choose the image (primary metric)
      class: "modules.data_pipeline.datasets.SVODataset"
      collate_fn: "modules.data_pipeline.datasets.svo_collate_fn"
      split: test
      text_path: "data/svo-probes/processed/all.pkl"
      img_path: "data/svo-probes/processed/image_embeddings.pt"
      task: "evaluate_image_choice"
    swap_full:   # choose the caption: every test caption with two nouns, subject and object swapped (datasets.build_swap_set)
      class: "modules.data_pipeline.datasets.SwapDataset"
      collate_fn: "modules.data_pipeline.datasets.text_choice_collate_fn"
      split: test
      derive: swap
      text_path: "data/svo-probes/processed/all.pkl"
      img_path: "data/svo-probes/processed/image_embeddings.pt"
      task: "evaluate_text_choice"
purity_weight: 0.0
checkpoint_every: 1
overrides:
- mlflow_db=mlf_dbs/hp3_pool.db
- text.layers=3
- purity_weight=0.0
- checkpoint_every=1
seed: 6
init_from: /cs/research/pplv/comp_bridge/qclip_snapshots/ckpt_from_hpc/hp_hp2_nodiscard_tl3_qlr3e-3_s6/best.pt
run_name: hp_do1_discard_tl3_pw0_initnd_s6
git_commit: 52fa8d8d0708db57ffdef04e182501bf73d9bd33
