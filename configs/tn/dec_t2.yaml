# Step 3, decoupled (TN_BRIEF.md): one shared vector per word (word_dim) + one shared tensor per complex type with an extra
# word leg; MPS (bond 8) only on type tensors of order >= 2 (max_order 1, order counts the word leg). Else = ref_clip.yaml. Norm init (text.init: norm).
model_type: tn
batch_size: 512
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 1
epochs: 3
patience: 1000
min_delta: 0.0
save_best: false
temperature: 0.07
embedding_dim: 512
text:
  n: 128
  s: 128
  p: 128
  bond_dim: 8
  max_order: 1
  decouple: true
  word_dim: 128
  tn_engine: levelwise
  init: norm
vision:
  method: clip
dataset:
  name: mscoco
  class: modules.data_pipeline.datasets.CocoDataset
  collate_fn: modules.data_pipeline.datasets.coco_collate_fn
  eval_mapper: modules.models.fusion.engine.mscoco_mapper
  train:
    text_path: data/mscoco/processed/tn/train.pkl
    img_path: data/mscoco/processed/image_embeddings.pt
  val:
    text_path: data/mscoco/processed/tn/val_holdout.pkl
    img_path: data/mscoco/processed/image_embeddings.pt
    diagnostics:
    - global_retrieval
  test:
    coco5k:
      class: modules.data_pipeline.datasets.CocoDataset
      collate_fn: modules.data_pipeline.datasets.coco_collate_fn
      text_path: data/mscoco/processed/validation.pkl
      img_path: data/mscoco/processed/image_embeddings.pt
      task: global_retrieval
      eval_mapper: modules.models.fusion.engine.mscoco_mapper
    aro_rel:
      class: modules.data_pipeline.datasets.ARODataset
      collate_fn: modules.data_pipeline.datasets.aro_collate_fn
      text_path: data/aro/processed/test_rel.pkl
      img_path: data/aro/processed/image_embeddings.pt
      task: evaluate_text_choice
    aro_att:
      class: modules.data_pipeline.datasets.ARODataset
      collate_fn: modules.data_pipeline.datasets.aro_collate_fn
      text_path: data/aro/processed/test_att.pkl
      img_path: data/aro/processed/image_embeddings.pt
      task: evaluate_text_choice
    svo_std:
      class: modules.data_pipeline.datasets.SVODataset
      collate_fn: modules.data_pipeline.datasets.svo_collate_fn
      text_path: data/svo-probes/processed/test.pkl
      img_path: data/svo-probes/processed/image_embeddings.pt
      task: evaluate_image_choice
    svo_swap_full:
      class: modules.data_pipeline.datasets.SwapDataset
      collate_fn: modules.data_pipeline.datasets.swap_collate_fn
      text_path: data/svo-probes/processed/swap_full.pkl
      img_path: data/svo-probes/processed/image_embeddings.pt
      task: evaluate_text_choice
    svo_swap_animate:
      class: modules.data_pipeline.datasets.SwapDataset
      collate_fn: modules.data_pipeline.datasets.swap_collate_fn
      text_path: data/svo-probes/processed/swap_animate.pkl
      img_path: data/svo-probes/processed/image_embeddings.pt
      task: evaluate_text_choice
    sugarcrepe_swap_object:
      class: modules.data_pipeline.datasets.SugarCrepePPDataset
      collate_fn: modules.data_pipeline.datasets.sugarcrepe_collate_fn
      text_path: data/sugarcrepe/processed/swap_object.pkl
      img_path: data/mscoco/processed/image_embeddings.pt
      task: evaluate_sugarcrepe_pp
    sugarcrepe_swap_atribute:
      class: modules.data_pipeline.datasets.SugarCrepePPDataset
      collate_fn: modules.data_pipeline.datasets.sugarcrepe_collate_fn
      text_path: data/sugarcrepe/processed/swap_atribute.pkl
      img_path: data/mscoco/processed/image_embeddings.pt
      task: evaluate_sugarcrepe_pp
    sugarcrepe_replace_object:
      class: modules.data_pipeline.datasets.SugarCrepePPDataset
      collate_fn: modules.data_pipeline.datasets.sugarcrepe_collate_fn
      text_path: data/sugarcrepe/processed/replace_object.pkl
      img_path: data/mscoco/processed/image_embeddings.pt
      task: evaluate_sugarcrepe_pp
    sugarcrepe_replace_attribute:
      class: modules.data_pipeline.datasets.SugarCrepePPDataset
      collate_fn: modules.data_pipeline.datasets.sugarcrepe_collate_fn
      text_path: data/sugarcrepe/processed/replace_attribute.pkl
      img_path: data/mscoco/processed/image_embeddings.pt
      task: evaluate_sugarcrepe_pp
    sugarcrepe_replace_relation:
      class: modules.data_pipeline.datasets.SugarCrepePPDataset
      collate_fn: modules.data_pipeline.datasets.sugarcrepe_collate_fn
      text_path: data/sugarcrepe/processed/replace_relation.pkl
      img_path: data/mscoco/processed/image_embeddings.pt
      task: evaluate_sugarcrepe_pp
    winoground:
      class: modules.data_pipeline.datasets.WinoGroundDataset
      collate_fn: modules.data_pipeline.datasets.winoground_collate_fn
      text_path: data/winoground/processed/test.pkl
      img_path: data/winoground/processed/image_embeddings.pt
      task: evaluate_winoground
