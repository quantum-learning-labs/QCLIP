# qclip v1 baseline QBoW (quantum bag of words): every word its own custom_v5 box on embedding_qubits qubits, the words
# merged by the Frobenius multiplication (text.spider; BaseAnsatz.spider): word order and grammar are ignored. Same
# recipe, image vector and qubit counts as the CCG-VQC (ps.yaml).
model_type: "vqc"
batch_size: 256
qlr: 0.01
clr: 0.0001
patience: 12
min_delta: 0.001
epochs: 100
embedding_qubits: 3
out_dim: 512

text:
  ansatz: "custom_v5"
  n: 1
  s: 1
  p: 1
  layers: 2
  curry: true
  root: "word"
  spider: true
  discard: false

vision:
  layers: 2
  method: "amp"

dataset: "svo-probes"
