# qclip v1 final post-selected model for ARO (attribute + relation captions): chosen by the v1 qubit search on split-0 val
# (REPRODUCE.md): k=9 output qubits (the raw CLIP vector, no PCA), 3 qubits per noun/sentence/prepositional wire, 3 text layers.
# Split-0 val hard_neg_acc (best epoch): n3L3 0.572 | n3L4 0.549 | n3L5 0.560 | n4L4 0.557 | n3 s9 p3 L3 root=frobenius 0.539;
# patience 30 gives the same 0.572. Trained without ARO hard negatives. ARO needs h_vmem >= 256G on the SGE cluster.
model_type: "vqc"
batch_size: 512
qlr: 0.01
clr: 0.0001
patience: 12
min_delta: 0.001
epochs: 100
embedding_qubits: 9
out_dim: 512

text:
  ansatz: "custom_v5"
  n: 3
  s: 3
  p: 3
  layers: 3
  curry: true
  root: "word"
  spider: false
  discard: false

vision:
  layers: 2
  method: "amp"

dataset: "aro"
