# qclip v1 baseline MicroCLIP-16 for SVO-Probes: CLIP's text transformer shrunk to 2 layers, 2 heads, width 16, against the
# raw 512-d CLIP vector. Width 32 can't reach the CCG-VQC's count (its embeddings + 32x512 projection alone are 31.6k), so
# width 16 with ff_dim 88 matches it: 19,504 text params (CCG-VQC 19,485; scripts/count_params.py).
model_type: "microclip"
batch_size: 256
lr: 0.001
weight_decay: 0.0
patience: 12
min_delta: 0.001
epochs: 100
embedding_dim: 512
loss: "hs"
temperature: 0.07
label_smoothing: 0.1

text:
  width: 16
  layers: 2
  heads: 2
  ff_dim: 88
  max_len: 32

vision:
  method: "amp"

dataset: "svo-probes"
