# qclip v1 final post-selected model for SVO-Probes: chosen by the v1 qubit search on split-0 val (REPRODUCE.md):
# k=9 output qubits (the raw CLIP vector, no PCA), one qubit per noun/sentence/prepositional wire, 2 text layers.
model_type: "vqc"
batch_size: 256
qlr: 0.01
clr: 0.0001
patience: 12
min_delta: 0.001
epochs: 100
embedding_qubits: 9
out_dim: 512

text:
  ansatz: "custom_v5"
  n: 1
  s: 1
  p: 1
  layers: 2
  curry: true
  root: "word"
  spider: false
  discard: false

vision:
  layers: 2
  method: "amp"

dataset: "svo-probes"
