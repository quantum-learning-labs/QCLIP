# classical tensor-network text model (MPS-decomposed word tensors) against frozen CLIP image vectors on SVO-Probes
model_type: "tn"
batch_size: 256
lr: 0.001
epochs: 5
embedding_dim: 512

text:
  n: 16
  s: 16
  p: 16
  bond_dim: 32
  max_order: 2

vision:
  method: "amp"   # FrozenCLIP: the image embedding itself

dataset: "svo-probes" # configs/data/svo-probes.yaml; dataset.* keys can be changed with --set
