model_type: "vqc"
batch_size: 256
qlr: 0.001
clr: 0.00001
patience: 12    
min_delta: 0.001
epochs: 100
embedding_qubits: 3
out_dim: 512

emulate:
  set: "swap_full"
  noise: false
  provider: "ibm" # 'ibm' or 'iqm': local calibration snapshots, emulate.profile picks the device (default miami / garnet)
  optimization_level: 1 # 0, 1, 2, 3
  resolution: 10000
  num_runs: 10
  backend: "statevector" # 'statevector', 'tensor_network', 'matrix_product_state', 'density_matrix'
  measurement_method: 'destructive_swap' # 'compute_uncompute', 'destructive_swap', or 'classical_shadows'

text:
  # ansatz: "custom_v6"
  n: 1
  s: 1
  p: 1
  layers: 2
  curry: true
  spider: false
  discard: false

vision:
  layers: 2
  method: 'mlp' # 'amp' or 'pca' or 'mlp'

dataset: "svo-probes" # configs/data/svo-probes.yaml; dataset.* keys can be changed with --set
