# Plain discard from scratch (hpsearch hp2 discard_tl3_pw0): Pauli_InfoNCE, 3 text layers, purity_weight 0.
# 10 seeds: val 0.836+-0.009, test std 0.813+-0.013. Better discard models start from post-selected weights: vqc_discard_distill.yaml
# Results quoted here used the legacy SVO split: reproduce them with --set dataset.split=legacy
model_type: "vqc"
mlflow_db: "mlf_dbs/svo-probes_final.db"
batch_size: 256
qlr: 0.01
clr: 0.0001
patience: 12    
min_delta: 0.001
epochs: 100
purity_weight: 0.0
embedding_qubits: 3
out_dim: 512

emulate:
  set: "swap_full"
  noise: false
  optimization_level: 1 # 0, 1, 2, 3
  resolution: 10000
  num_runs: 10
  backend: "statevector" # 'statevector', 'tensor_network', 'matrix_product_state', 'density_matrix'
  measurement_method: 'destructive_swap' # 'compute_uncompute', 'destructive_swap', or 'classical_shadows'

text:
  n: 1
  s: 1
  p: 1
  layers: 3
  curry: true
  spider: false
  discard: true

vision:
  layers: 2
  method: 'mlp' # 'amp' or 'pca' or 'mlp'

dataset: "svo-probes" # configs/data/svo-probes.yaml; dataset.* keys can be changed with --set
